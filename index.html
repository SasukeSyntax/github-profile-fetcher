<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info-Fetcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <input type="text" class="search-bar" id="search-bar" placeholder="username">
        <button class="search-button" id="search-button">Fetch</button>
    </header>

    <div id="parent-body">

        <div id="avatar">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcNhOjJgxzi0prfoDdneej8cjvW-CeWKm_kQ&s" alt="avatar">
        </div>

        <div class="info" id="profile-info">
            <div id="general-info">
                <h3 class="username-and-stuff"  id="name">Name</h3>
                <p  class="username-and-stuff" id="username">Username</p>
                <p  class="username-and-stuff" id="bio">Bio</p>
            </div>

            <div class="info" id="profile-activity-info">

                <div class="followers-and-stuff" id="no-of-repos">
                    <h3 class="number" id="repo-count">n</h3>
                    <p>Repos</p>
                </div>

                <div class="followers-and-stuff" id="followers">
                    <h3 class="number" id="follower-count">n</h3>
                    <p>Followers</p>
                </div>

                <div class="followers-and-stuff" id="following">
                    <h3 class="number" id="following-count">n</h3>
                    <p>Following</p>
                </div>


            </div>

            <div class="info" id="profile-link-and-location">
                <p id="location">Location</p>
                <a href="" id="github-link" target="_blank">BlahBlah</a>
            </div>
        </div>

    </div>



    <script src="index.js"></script>
</body>
</html>
